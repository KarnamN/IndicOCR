<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error - OCR Correction Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .error-box {
            text-align: center;
            max-width: 480px;
            padding: 2rem;
        }
        .error-box h1 {
            font-size: 1.5rem;
            color: #dc2626;
        }
        .error-box p {
            color: #475569;
            margin: 1rem 0 1.5rem;
        }
        .error-box a {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>⚠️ {{ message or "Something went wrong" }}</h1>
        <p>Go back and try resuming the job again from its results folder.</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
